name: Deploy Pages

on:
  push:
    branches: ["live"]
  schedule:
    - cron: "0,15,30,45 8-18 16-27 11 *"  # Du 16 au 27 de novembre, toutes les 15 minutes entre 9h et 19h
  workflow_dispatch:
  workflow_run:
    workflows: ["Speedlify 2 — scan & publish"]
    types: 
      - "completed"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ">=22.19"
      - name: Install npm dependencies
        run: npm install
      - name: Build speedlify
        env:
          SPEEDLIFY_SITE_URL: https://coda-dijon.github.io/speedlify-dijon-b1-2026
          SPEEDLIFY_REPO_URL: https://github.com/Coda-Dijon/speedlify-dijon-b1-2026
        run: |
          npm run build -- --pathprefix=${GITHUB_REPOSITORY#*/}
          npm run zip-results
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
