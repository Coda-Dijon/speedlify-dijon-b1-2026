name: Deploy Pages

on:
  push:
    branches: ["live"]
  schedule:
    - cron: "0,15,30,45 8-18 8-14 11 *"  # Du 8 au 14 de novembre, toutes les 15 minutes entre 9h et 19h
  workflow_dispatch:
  workflow_run:
    workflows: ["Speedlify — scan & publish"]
    types: 
      - "completed"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install npm dependencies
        run: npm install
      - name: Build speedlify
        run: |
          npm run build -- --pathprefix=${GITHUB_REPOSITORY#*/}
          npm run zip-results
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
